<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460" role="img" aria-labelledby="title desc">
  <title id="title">Serverless data lake quality pipeline</title>
  <desc id="desc">Bounded public taxi CSV flows through a private raw S3 bucket and AWS Glue validation. Good records become curated partitioned Parquet, rejected records and summaries are audited, and Athena queries Glue Catalog tables. EventBridge and CloudWatch monitor failed jobs.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0l8 4-8 4" fill="#9ad968"/></marker></defs>
  <rect width="900" height="460" rx="20" fill="#101b30"/>
  <g font-family="Arial,sans-serif" fill="#fff">
    <text x="32" y="48" font-size="27" font-weight="bold">Data lake + quality checks</text>
    <text x="32" y="74" font-size="15" fill="#aac1d7">AWS CDK • serverless batch PoC • planned architecture</text>
  </g>
  <g fill="#192d49" stroke="#64c6ef" stroke-width="2">
    <rect x="25" y="132" width="152" height="82" rx="12"/><rect x="220" y="132" width="142" height="82" rx="12"/>
    <rect x="406" y="132" width="150" height="82" rx="12"/><rect x="612" y="103" width="165" height="62" rx="12"/>
    <rect x="612" y="179" width="165" height="62" rx="12"/><rect x="612" y="255" width="165" height="62" rx="12"/>
    <rect x="424" y="353" width="160" height="71" rx="12"/><rect x="612" y="353" width="165" height="71" rx="12"/>
    <rect x="25" y="329" width="335" height="79" rx="12"/>
  </g>
  <g font-family="Arial,sans-serif" fill="#fff" text-anchor="middle">
    <text x="101" y="166" font-size="17">Chicago public</text><text x="101" y="189" font-size="14">taxi CSV ≤2 MB</text>
    <text x="291" y="166" font-size="18">S3 raw</text><text x="291" y="189" font-size="14">private + SSE</text>
    <text x="481" y="166" font-size="17">Glue 4.0</text><text x="481" y="189" font-size="13">validate + dedupe</text>
    <text x="695" y="129" font-size="17">S3 curated</text><text x="695" y="150" font-size="13">partitioned Parquet</text>
    <text x="695" y="205" font-size="17">S3 rejected</text><text x="695" y="226" font-size="13">reasons + raw fields</text>
    <text x="695" y="281" font-size="17">Quality summary</text><text x="695" y="303" font-size="13">JSON per run</text>
    <text x="504" y="380" font-size="16">Glue Catalog</text><text x="504" y="403" font-size="13">explicit tables</text>
    <text x="695" y="380" font-size="16">Athena</text><text x="695" y="403" font-size="13">bounded scan + results</text>
    <text x="192" y="357" font-size="16">EventBridge Scheduler: OFF</text>
    <text x="192" y="383" font-size="13">Failures → CloudWatch alarm</text>
  </g>
  <g stroke="#9ad968" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <path d="M177 173h42"/><path d="M362 173h43"/><path d="M556 156h55"/><path d="M556 176h55"/><path d="M556 197h33v88h22"/>
    <path d="M694 317v20h-109"/><path d="M694 241v96h-109"/><path d="M694 165v172h-109"/>
    <path d="M584 389h27"/><path d="M361 374h62"/>
  </g>
</svg>
